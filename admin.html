  <script>
    // replicate small sidebar behavior as in admin.php
    document.getElementById('sidebarToggle')?.addEventListener('click', function() {
      const sb = document.getElementById('sidebar');
      if (!sb) return;
      sb.classList.toggle('open');
      sb.classList.toggle('d-none');
      const overlay = document.querySelector('.sidebar-overlay');
      if (sb.classList.contains('open')) overlay.classList.add('active'); else overlay.classList.remove('active');
    });
    document.querySelector('.sidebar-overlay')?.addEventListener('click', function(){
      const sb = document.getElementById('sidebar');
      if (!sb) return;
      sb.classList.remove('open'); this.classList.remove('active'); sb.classList.add('d-none');
    });
    document.getElementById('sidebarCollapseToggle')?.addEventListener('click', function(){
      const sb = document.getElementById('sidebar'); if (!sb) return; sb.classList.toggle('collapsed'); this.textContent = sb.classList.contains('collapsed') ? '◂' : '▸';
    });
  </script>
